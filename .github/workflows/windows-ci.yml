name: Windows build and checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build Release
        run: dotnet build WindowsMemo.slnx --configuration Release --nologo -p:RestoreLockedMode=true
      - name: Check synthetic ZIP and installer archives
        run: ./scripts/test-archive-validation.ps1
      # Executable test harness; dotnet test does not run these checks.
      # --shell-probe requires a logged-in desktop and stays a local check.
      - name: Run automated checks
        run: dotnet tests/WindowsMemo.Tests/bin/Release/net10.0-windows/WindowsMemo.Tests.dll
      - name: Run isolated crash recovery probe
        run: dotnet tests/WindowsMemo.Tests/bin/Release/net10.0-windows/WindowsMemo.Tests.dll --crash-probe
      - name: Smoke test recovery window lifetime
        run: dotnet tests/WindowsMemo.Tests/bin/Release/net10.0-windows/WindowsMemo.Tests.dll --recovery-probe --cycles 5 --idle-seconds 1
      - name: Upload recovery lifetime metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-lifetime-metrics
          path: tests/WindowsMemo.Tests/bin/Release/net10.0-windows/recovery-probe/*/metrics.jsonl
          retention-days: 14
          if-no-files-found: warn
      - name: Render sample note controls
        run: dotnet tests/WindowsMemo.Tests/bin/Release/net10.0-windows/WindowsMemo.Tests.dll --render-ui-only
      - name: Upload sample UI renders
        uses: actions/upload-artifact@v7
        with:
          name: sample-ui-renders
          path: tests/WindowsMemo.Tests/bin/Release/net10.0-windows/ui-previews/*.png
          retention-days: 14
          if-no-files-found: error
      - name: Verify isolated prototype ZIP generation
        run: |
          function Get-DefaultOutputSnapshot {
            foreach ($path in @('src/WindowsMemo/bin/Release/net10.0-windows/WindowsMemo.dll', 'tests/WindowsMemo.Tests/bin/Release/net10.0-windows/WindowsMemo.Tests.dll')) {
              $item = Get-Item -LiteralPath $path
              "$($item.FullName):$($item.LastWriteTimeUtc.Ticks):$((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash)"
            }
          }
          $before = @(Get-DefaultOutputSnapshot)
          $results = @(./scripts/package.ps1 | ForEach-Object { if ($_ -is [string]) { Write-Host $_ } else { $_ } })
          $package = @($results | Where-Object { $_.PSObject.Properties.Name -contains 'ChecksumFile' })
          if ($package.Count -ne 1) { throw 'Expected one isolated ZIP result.' }
          ./scripts/test-package.ps1 -ZipPath $package[0].Zip
          if (Compare-Object $before @(Get-DefaultOutputSnapshot)) { throw 'Packaging changed the default build outputs.' }
          Write-Host 'PASS default build outputs unchanged after isolated packaging'
