name: Windows build and checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build Release
        run: dotnet build WindowsMemo.slnx --configuration Release --nologo
      # Executable test harness; dotnet test does not run these checks.
      # --shell-probe requires a logged-in desktop and stays a local check.
      - name: Run automated checks
        run: dotnet tests/WindowsMemo.Tests/bin/Release/net10.0-windows/WindowsMemo.Tests.dll
