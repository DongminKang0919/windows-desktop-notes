name: Build prototype ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build, check and package
        run: ./scripts/package.ps1
      - name: Check package rejection paths
        run: |
          Get-ChildItem -Path artifacts/package-*/*.zip | ForEach-Object {
            ./scripts/test-package.ps1 -ZipPath $_.FullName
          }
      - name: Upload verified ZIP and checksum
        uses: actions/upload-artifact@v7
        with:
          name: WindowsMemo-win-x64-prototype
          path: |
            artifacts/package-*/*.zip
            artifacts/package-*/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
